[project]
name = "brainup"
version = "0.1.0"
description = "升级大脑 — LLM 编译维护的复利知识库引擎（读书/学习场景，CLI + MCP）"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "The brainup Authors" }]
keywords = [
    "llm-wiki",
    "knowledge-base",
    "personal-knowledge-management",
    "mcp",
    "karpathy",
    "okf",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.9",
    "pydantic>=2.9",
    "httpx>=0.27",
    "mcp>=1.2",
    "pyyaml>=6.0",
    "pypdf>=5.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/shaohuifan/brainup"
Design = "https://github.com/shaohuifan/brainup/blob/main/design/design-proposal-v0.1.md"

[project.scripts]
brainup = "brainup.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainup"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008：typer 的 Argument/Option 默认值模式是官方推荐写法
"src/brainup/cli.py" = ["B008"]
"tests/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
